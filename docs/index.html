<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lift Log">
  <title>Lift Log</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand" id="topTitle">Lift Log</div>
    <button class="icon-btn" id="syncBtn" aria-label="Sync status"></button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings"></button>
  </header>

  <main id="view"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
    <div class="timer-row">
      <button class="t-btn" data-t="-15">−15</button>
      <div class="timer-mid">
        <div class="timer-label" id="timerLabel">Rest</div>
        <div class="timer-time" id="timerTime">0:00</div>
      </div>
      <button class="t-btn" data-t="15">+15</button>
      <button class="t-btn t-skip" data-t="skip">Skip</button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button data-tab="train"><span class="ti" data-icon="dumbbell"></span>Train</button>
    <button data-tab="history"><span class="ti" data-icon="history"></span>History</button>
    <button data-tab="progress"><span class="ti" data-icon="chart"></span>Progress</button>
    <button data-tab="program"><span class="ti" data-icon="list"></span>Program</button>
  </nav>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <div class="sheet-scrim" data-close></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
